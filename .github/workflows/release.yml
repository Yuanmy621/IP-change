name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '已合并到 main 的正式版本号，例如 1.3.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  preflight:
    name: 校验发布版本
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 只允许从 main 启动发布
        env:
          REF: ${{ github.ref }}
        run: test "$REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 检查版本递增和正式变更记录
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          curl --fail --location --retry 3 --max-time 60 https://github.com/Yuanmy621/IP-change/releases/latest/download/update.json -o dist/latest-update.json
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'scripts/ci')
          from artifacts import check_upgrade
          with open('dist/latest-update.json') as file:
              latest = json.load(file)
          name, code = check_upgrade(os.environ['RELEASE_VERSION'], latest)
          print('发布版本：', name, '构建号：', code)
          PY

  ci:
    name: 发布前完整校验
    needs: preflight
    uses: ./.github/workflows/ci.yml

  android:
    name: 原签名 Android 安装包
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: 从 Actions Secret 准备原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.DINGDIAN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          data = os.environ.get('KEYSTORE_BASE64', '')
          if not data:
              raise SystemExit('请先配置 DINGDIAN_ANDROID_KEYSTORE_BASE64，禁止临时签名发布')
          file = Path(os.environ['RUNNER_TEMP']) / 'dingdian.keystore'
          file.write_bytes(base64.b64decode(data, validate=True))
          file.chmod(0o600)
          PY
      - name: 构建并确认与已发布证书一致
        env:
          DINGDIAN_KEYSTORE_PATH: ${{ runner.temp }}/dingdian.keystore
          DINGDIAN_KEYSTORE_PASSWORD: ${{ secrets.DINGDIAN_ANDROID_KEYSTORE_PASSWORD }}
          DINGDIAN_KEY_ALIAS: ${{ secrets.DINGDIAN_ANDROID_KEY_ALIAS }}
          DINGDIAN_KEY_PASSWORD: ${{ secrets.DINGDIAN_ANDROID_KEY_PASSWORD }}
        run: python3 scripts/prepare-release.py
      - name: 清理临时签名密钥
        if: always()
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/dingdian.keystore
        run: rm -f "$KEYSTORE_FILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release-apk
          path: dist/定点-Android.apk
          retention-days: 1

  bundle:
    name: 打包 Mac 与 iOS 实验版
    needs: android
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: sdkmanager 'platform-tools' 'build-tools;36.0.0'
      - name: 打包当前 Mac SDK 的 ADB 与许可证
        run: cp -R "$ANDROID_HOME/platform-tools" platform-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release-apk
          path: dist
      - run: ./build.sh
      - run: ./build-ios.sh
      - name: 打包并校验所有下载附件
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/prepare-release.py --skip-build --with-mac --with-ios
          python3 scripts/ci/artifacts.py --release "dist/release-$RELEASE_VERSION"
          python3 scripts/ci/publish-release.py "dist/release-$RELEASE_VERSION" --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-release-assets
          path: |
            dist/release-${{ inputs.version }}/*.apk
            dist/release-${{ inputs.version }}/*.zip
            dist/release-${{ inputs.version }}/*.ipa
            dist/release-${{ inputs.version }}/update.json
            dist/release-${{ inputs.version }}/SHA256SUMS.txt
            dist/release-${{ inputs.version }}/release-notes.md
          retention-days: 7

  publish:
    name: 上传并发布最新正式版本
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-release-assets
          path: dist/release-assets
      - name: 草稿上传、远端摘要核对、全部完成后设为 Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/publish-release.py dist/release-assets
